name: CI

# `version*` matters: all Roxy work moved to `version2` on 2026-08-05 (standing
# order), and that branch matched neither trigger — so every job here, including
# the edge-function Deno suite, sat idle through an entire day of commits while
# the only thing actually gating anything was a human running npx by hand.
# A workflow that never fires is not CI.
on:
  push:
    branches: [main, 'session-*', 'version*']
  pull_request:
    branches: [main, 'version*']

jobs:
  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npx jest --ci --passWithNoTests

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

  edge-functions:
    name: Edge Function Tests (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --no-check: stripe-node 14.25.0 pins `apiVersion` in its types to
      # '2023-10-16', while create-product-order and create-payment-intent both
      # pass '2024-06-20' (valid at runtime — it is just the Stripe-Version
      # header). Type-checking here would fail on that pre-existing mismatch and
      # tell us nothing about the tests. Drop this flag once the pin is resolved.
      # --allow-read: _shared/rateLimit.guard.test.ts reads the other functions'
      # source to prove none of them reintroduces the split checkRateLimit /
      # logAiCall pair. Because --no-check is on, that grep is the ONLY gate on
      # it — the type checker never sees these files.
      - name: Run edge function tests
        run: deno test --no-check --allow-net --allow-env --allow-read .

  studio-e2e:
    name: Studio E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run unauthenticated E2E tests
        run: npx playwright test --project=unauthenticated

      - name: Run authenticated E2E tests
        run: npx playwright test --project=setup --project=authenticated

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/studio/playwright-report/
          retention-days: 7
