name: Mirror to naaxtech/roxy-client

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAAXTECH_MIRROR_SSH_KEY }}

      - name: Push to naaxtech mirror
        run: |
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add mirror git@github.com:naaxtech/roxy-client.git
          git push mirror main:main --force
