# Maestro flow: Join and leave a community
# Tests the join/leave RLS policies and local state update.
# Run: maestro test .maestro/flows/community_join_leave.yaml
#
# Prerequisites:
#   - Dev build running on emulator/device (com.roxy.app)
#   - User signed in (run login flow first if needed)
#
# Roxy 3.0: Connect is gone. Community discovery is Discover's Communities rail,
# and the full searchable browser — the screen this flow needs, because the rail
# caps at twelve — is behind the rail's "See all" link at `/communities`.
appId: com.roxy.app
---
- runFlow: ../subflows/dismiss_first_run.yaml

- tapOn:
    id: "nav-slot-discover"

# The Communities top chip narrows the board to one rail, so "See all" is on
# screen without a scroll on any device size.
- tapOn:
    id: "discover-chips-comms"

- tapOn:
    id: "rail-communities-link"

# Browser screen loaded
- assertVisible:
    text: "Communities"
    timeout: 5000

# Find "Queer Gamers" community (seeded in 003_communities_social.sql)
- scrollUntilVisible:
    element:
      text: "Queer Gamers"
    direction: DOWN
    timeout: 5000

# Tap join — the button is next to "Queer Gamers"
- tapOn:
    text: "Join"
    index: 0

# Wait for state update and verify button changed
- assertVisible:
    text: "Joined"
    timeout: 3000

# Tap the card to open community detail
- tapOn:
    text: "Queer Gamers"

# Verify detail screen loaded — joined state shows "Joined" on the detail button
- assertVisible:
    text: "Joined"
    timeout: 3000

# Go back
- back

# Now leave the community from the list
- scrollUntilVisible:
    element:
      text: "Queer Gamers"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: "Joined"

# Verify reverted to Join
- assertVisible:
    text: "Join"
    timeout: 3000
