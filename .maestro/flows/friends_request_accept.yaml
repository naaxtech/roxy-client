# Test: Send friend request from community members, then accept it.
# Prerequisites: Two accounts available. Run with first account signed in.
# Note: Full accept flow requires two devices/accounts — this tests the Requests tab UI.
appId: com.roxy.app
---
- tapOn:
    text: "Discover"
- scrollUntilVisible:
    element:
      text: "Queer Gamers"
    direction: DOWN
    timeout: 5000
- tapOn:
    text: "Queer Gamers"
- tapOn:
    text: "members"
- assertVisible:
    text: "Members"
    timeout: 3000
- tapOn:
    text: "Add Friend"
    index: 0
- assertVisible:
    text: "Requested"
    timeout: 3000
- back
- tapOn:
    text: "Grow"
- tapOn:
    text: "My People"
- assertVisible:
    text: "My People"
    timeout: 3000
- tapOn:
    text: "Sent"
- assertVisible:
    text: "Cancel"
    timeout: 3000
