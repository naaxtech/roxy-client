# Test: New user signup → 4-step onboarding → the Feed tab
#
# What this validates:
#   1. After signup, user lands on step1-identity (not looped back)
#   2. Each Next tap advances to the next step (no flicker/redirect loop)
#   3. After step4, user reaches the Feed tab (step4-status.tsx replaces to
#      '/(tabs)/feed' — Grow was dissolved by the 3.0 flattening)
#   4. The app shell is inaccessible until onboarding completes
#
# Prerequisites:
#   - Dev build installed on device/emulator (eas build --profile development)
#   - Supabase project reachable
#   - Use a fresh email each run, OR reset the test account in Supabase:
#       UPDATE profiles SET onboarding_completed = false WHERE id = '<test-user-id>';
#       (or delete the profile row entirely)
#
# Test credentials — set via env or edit directly:
#   MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD
#   MAESTRO_INVITE_CODE — a code the gate will accept. Roxy is invite-only, so
#   there is no signup path without one.
#
appId: com.roxy.app
---

# ── Launch fresh ──────────────────────────────────────────────────────────────
- launchApp:
    clearState: true

# ── Invite-code gate ───────────────────────────────────────────────────────────
# The front door is the code gate, not the welcome screen. A code is what puts
# the welcome screen into SIGN-UP mode at all: `isSignIn` is `!validatedCode`, so
# arriving without one produces a sign-IN form and this flow would try to log
# into an account that does not exist yet.
- assertVisible:
    id: "code-gate-screen"
    timeout: 8000
- tapOn:
    id: "code-input"
- inputText: "${MAESTRO_INVITE_CODE}"
- tapOn:
    id: "code-submit"

# ── Sign-up form ───────────────────────────────────────────────────────────────
- assertVisible:
    id: "welcome-screen"
    timeout: 8000
- tapOn:
    id: "use-email-link"
- tapOn:
    id: "email-input"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn:
    id: "auth-submit-btn"

# ── Step 1 — Identity ──────────────────────────────────────────────────────────
# Critical: must land here and NOT flicker back after filling in data
- assertVisible:
    text: "Step 1 of 4"
    timeout: 10000

- tapOn:
    id: "username-input"
- inputText: "testuser_e2e"

# Wait for availability check
- assertVisible:
    text: "✓ Available"
    timeout: 5000

- tapOn:
    id: "display-name-input"
- inputText: "E2E Test User"

# Pick an identity chip
- tapOn:
    text: "lesbian"

# Tap Next — this is where the redirect loop used to fire
- tapOn:
    text: "Next →"

# ── Step 2 — Interests ─────────────────────────────────────────────────────────
# Critical: useSegments() emits transient ['(auth)'] during Stack push animation.
# Fixed by: router.replace (not push) + pathname.includes('/onboarding') guard.
# Must land here, NOT loop back to step1
- assertVisible:
    text: "Step 2 of 4"
    timeout: 5000

- tapOn:
    text: "Gaming"
- tapOn:
    text: "Next →"

# ── Step 3 — Photo ─────────────────────────────────────────────────────────────
- assertVisible:
    text: "Step 3 of 4"
    timeout: 5000

# Skip photo — tap "Skip for now"
- tapOn:
    text: "Skip for now"

# ── Step 4 — Goals ─────────────────────────────────────────────────────────────
- assertVisible:
    text: "Step 4 of 4"
    timeout: 5000

- tapOn:
    text: "COMMUNITY"
- tapOn:
    text: "Meet Roxy →"

# ── The app shell ──────────────────────────────────────────────────────────────────
# She must land in the app, not be stuck in onboarding. Assert the screen AND
# the bar: a testID on the screen alone would pass if the navigator failed to
# mount its chrome, which is a broken app that still renders a feed.
- assertVisible:
    id: "feed-screen"
    timeout: 15000
- assertVisible:
    id: "nav-bar"
    timeout: 5000

# Confirm the onboarding screens are gone — back navigation should not reveal them
- assertNotVisible:
    text: "Step 1 of 4"
- assertNotVisible:
    text: "Step 4 of 4"
