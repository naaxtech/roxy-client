# Maestro flow: Community detail screen — tab pager and RSVP
# Tests: horizontal tab pager (Posts/Events/Games), RSVP button.
# Run: maestro test .maestro/flows/community_detail_tabs.yaml

appId: com.roxy.app
---
- tapOn:
    text: "Discover"

- scrollUntilVisible:
    element:
      text: "Queer Gamers"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: "Queer Gamers"

# Verify Posts tab is default active
- assertVisible:
    text: "Posts"

# Swipe to Events tab
- tapOn:
    text: "Events"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    text: "Events"

# Swipe to Games tab
- tapOn:
    text: "Games"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    text: "Speed Dating"

# Tap back to Posts
- tapOn:
    text: "Posts"

- back
