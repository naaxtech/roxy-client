# Maestro flow: Open a community post and add a comment
# Tests: post detail navigation, comment submission, comment display.
# Run: maestro test .maestro/flows/community_post_comments.yaml
#
# Prerequisites:
#   - User must be a member of at least one community with posts
#   - Run community_join_leave flow first if no communities joined yet
#
# Roxy 3.0: the Connect feed is gone. Community posts are read on the community
# detail screen's Posts page, which is still the FeedCard pipeline — the Feed
# tab is the full-bleed pager and a different component entirely.
appId: com.roxy.app
---
- runFlow: ../subflows/dismiss_first_run.yaml

- tapOn:
    id: "nav-slot-discover"

- tapOn:
    id: "discover-chips-comms"

# Through "See all", not the rail. The rail is a HORIZONTAL ScrollView capped at
# twelve cards, so `scrollUntilVisible … direction: DOWN` cannot reach a
# community that is off to the right — it only ever passed when the seed order
# happened to put this one in the first two or three visible cards. The browser
# behind this link is a vertical list of all of them.
- tapOn:
    id: "rail-communities-link"

- scrollUntilVisible:
    element:
      text: "Queer Gamers"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: "Queer Gamers"

- waitForAnimationToEnd:
    timeout: 3000

# A still post, never a video: `contentDetailPath()` sends video posts to the
# player at /community/video/<id> and everything else to the post detail at
# /community/post/<id>. Tapping "whichever card is first" picks a different
# screen depending on what that community posted most recently.
- tapOn:
    id: "static-card"
    index: 0

- assertVisible:
    id: "post-detail-screen"
    timeout: 5000

- assertVisible:
    text: "Add a comment…"

- tapOn:
    text: "Add a comment…"

- inputText: "Testing Maestro 💜"

# "Post" only appears once the draft has text
- assertVisible:
    text: "Post"

- tapOn:
    text: "Post"

- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    text: "Testing Maestro 💜"
    timeout: 5000

- tapOn:
    id: "post-detail-back"
